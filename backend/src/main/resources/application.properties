spring.application.name=sport-vision-backend
server.address=127.0.0.1
server.port=8080

# -------------------------------------------------------------------
# Base de Données Active : MySQL (XAMPP localhost:3306)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sport_vision?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA / Hibernate pour MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# CORS & Sécurité
# -------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
app.jwt.expiration-ms=7200000
# Secret JWT (>= 32 caracteres). Si vide, un secret aleatoire est genere au demarrage.
app.jwt.secret=${JWT_SECRET:}

# -------------------------------------------------------------------
# Reinitialisation du mot de passe & envoi d'e-mails (SMTP)
# Definir SMTP_HOST / SMTP_USERNAME / SMTP_PASSWORD pour envoyer de vrais mails.
# Sans SMTP_HOST, le lien de reinitialisation est uniquement ecrit dans les logs (dev).
# -------------------------------------------------------------------
app.frontend-url=http://localhost:4200
app.mail.from=${MAIL_FROM:no-reply@sportvision.com}
app.password-reset.expiration-minutes=30
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.sql.init.mode=never
spring.h2.console.enabled=false
training.demo.enabled=false
sportvision.demo.enabled=false
training.ai.api-key=${GEMINI_API_KEY:}
training.ai.model=${GEMINI_MODEL:gemini-2.5-flash}
training.ai.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:45}
# Only used when no explicit profile is selected. Explicit nonlocal profiles remain closed.
training.dataset.enabled=false
