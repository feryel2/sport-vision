# ===================================================================
# SPORT VISION - Gestion 3 : Boutique & Produits Sportifs
# Responsable : Feryel Mansouri
# ===================================================================
spring.application.name=sport-vision-backend
server.port=8080

# -------------------------------------------------------------------
# Base de Données Active : MySQL (XAMPP localhost:3306)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sport_vision?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA / Hibernate pour MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# CORS & Sécurité
# -------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
app.jwt.expiration-ms=86400000
