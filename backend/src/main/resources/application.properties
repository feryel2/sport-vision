spring.application.name=sport-vision-training-backend
spring.profiles.default=dev
server.address=127.0.0.1
server.port=8082
server.servlet.context-path=/api/training
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false

training.ai.api-key=${GEMINI_API_KEY:}
training.ai.model=${GEMINI_MODEL:gemini-2.5-flash}
training.ai.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:45}
