# Isolated, explicitly activated demo. Never targets an existing database.
server.address=127.0.0.1
server.port=8082
spring.datasource.url=jdbc:h2:mem:sportvision_integration_nour_feryel;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.h2.console.enabled=false
training.demo.enabled=false
sportvision.demo.enabled=false
