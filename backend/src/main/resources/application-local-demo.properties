# Local workstation demonstration. Separate from all historical integration/Nour databases.
server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/local-demo/sportvision;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.h2.console.enabled=false
training.demo.enabled=false
sportvision.demo.enabled=false
training.dataset.enabled=true
