# Explicit opt-in only. Supply a dedicated integration database, never a shared database.
spring.datasource.url=${SPORTVISION_MYSQL_URL}
spring.datasource.username=${SPORTVISION_MYSQL_USERNAME}
spring.datasource.password=${SPORTVISION_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.h2.console.enabled=false
training.demo.enabled=false
sportvision.demo.enabled=false
